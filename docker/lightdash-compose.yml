# Lightdash BI, kept separate from the project's teaching docker-compose.yml.
#   docker compose -f docker/lightdash-compose.yml up -d --wait
services:
  # Lightdash's OWN database: users, saved charts, dashboards.
  # Nothing to do with the `nova` warehouse — do not point Lightdash's PG* vars at nova.
  lightdash-db:
    image: postgres:16
    container_name: lightdash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lightdash
      POSTGRES_PASSWORD: lightdash
      POSTGRES_DB: lightdash
    volumes:
      - lightdash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightdash -d lightdash"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lightdash 2.x requires S3-compatible storage (app images, cached results).
  # MinIO provides that locally. Pre-creating /data/lightdash makes the bucket exist.
  minio:
    image: minio/minio:latest
    container_name: lightdash-minio
    restart: unless-stopped
    # The image entrypoint prepends `minio`, so override it to run a shell.
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/lightdash && exec minio server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # browser fetches presigned URLs here
      - "9001:9001"     # MinIO console
    volumes:
      - lightdash_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  lightdash:
    image: lightdash/lightdash:2.17.0
    container_name: lightdash
    restart: unless-stopped
    depends_on:
      lightdash-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env.lightdash
    environment:
      # Metadata DB — the service above, not the warehouse.
      PGHOST: lightdash-db
      PGPORT: 5432
      PGUSER: lightdash
      PGPASSWORD: lightdash
      PGDATABASE: lightdash
      SITE_URL: http://localhost:8080
      SECURE_COOKIES: "false"        # plain http on localhost
      DBT_PROJECT_DIR: /usr/app/dbt
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000   # browser can't resolve `minio`
      S3_BUCKET: lightdash
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"                 # MinIO needs path-style URLs
    ports:
      - "8080:8080"
    volumes:
      # Your dbt project. NOT :ro — `dbt deps` writes dbt_packages/ and logs/ in here.
      - ../nova_analytics:/usr/app/dbt:z   # :z relabels for SELinux (Fedora enforcing)

volumes:
  lightdash_pgdata:
  lightdash_minio:

# Your warehouse's network, created by the root docker-compose.yml.
# Joining it means Lightdash reaches Postgres at host `postgres`, port 5432 —
# container-to-container, so the host firewall/VPN is never in the path.
networks:
  default:
    name: nova-ecommerce-platform_default
    external: true
