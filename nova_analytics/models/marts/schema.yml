version: 2

models:
  - name: fct_orders
    description: One row per order line, sourced from the CSV ETL.
    meta:
      metrics:
        avg_order_value:
          type: number
          sql: ${total_revenue} / NULLIF(${total_orders}, 0)
      joins:
        - join: dim_customers
          sql_on: ${fct_orders.customer_id} = ${dim_customers.customer_id}
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
        meta:
          metrics:
            total_orders:
              type: count_distinct
      - name: amount
        data_tests:
          - not_null
        meta:
          metrics:
            total_revenue:
              type: sum
              filters:
                - status: completed
            gross_amount:
              type: sum
      - name: order_date
        data_tests:
          - not_null
        meta:
          dimension:
            type: date
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, completed, cancelled, refunded]
        meta:
          dimension:
            type: string
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: source('shop', 'customers')
                field: id
        meta:
          dimension:
            type: number
      - name: category
        meta:
          dimension:
            type: string
      - name: product_name
        meta:
          dimension:
            type: string
      - name: quantity
        meta:
          metrics:
            total_quantity:
              type: sum

  - name: dim_customers
    description: Customer dimension, one row per customer, joined to fct_orders on customer_id.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
        meta:
          dimension:
            type: number
      - name: name
        meta:
          dimension:
            type: string
            label: Customer Name
      - name: country
        meta:
          dimension:
            type: string
      - name: signup_date
        meta:
          dimension:
            type: date

  - name: dim_date
    description: Date dimension, one row per calendar day from 2025-01-01 to 2026-12-31.
    columns:
      - name: date_key
        description: YYYYMMDD integer. Surrogate key facts join on.
        data_tests:
          - unique
          - not_null
        meta:
          dimension:
            type: number
            label: Date Key
      - name: full_date
        data_tests:
          - unique
          - not_null
        meta:
          dimension:
            type: date
            label: Date
      - name: year
        meta:
          dimension:
            type: number
      - name: quarter
        meta:
          dimension:
            type: number
            label: Quarter
      - name: month
        meta:
          dimension:
            type: number
      - name: month_name
        meta:
          dimension:
            type: string
            label: Month Name
      - name: day_of_month
        meta:
          dimension:
            type: number
            label: Day of Month
      - name: day_of_week
        meta:
          dimension:
            type: number
            label: Day of Week
      - name: day_name
        meta:
          dimension:
            type: string
            label: Day Name
      - name: is_weekend
        meta:
          dimension:
            type: boolean
            label: Is Weekend
      - name: iso_week
        meta:
          dimension:
            type: number
            label: ISO Week
