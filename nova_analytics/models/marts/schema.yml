version: 2

models:
  - name: fct_orders
    description: One row per order line, sourced from the CSV ETL.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, completed, cancelled, refunded]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: source('shop', 'customers')
                field: id
