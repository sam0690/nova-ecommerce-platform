version: 2

models:
  - name: fct_orders
    description: >
      One row per order line, sourced from the CSV ETL. Order counts and
      quantities live here; REVENUE DOES NOT -- see fct_revenue_events.
    meta:
      joins:
        - join: dim_customers
          sql_on: ${fct_orders.customer_id} = ${dim_customers.customer_id}
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
        meta:
          metrics:
            total_orders:
              type: count_distinct
      - name: amount
        data_tests:
          - not_null
        meta:
          metrics:
            # `total_revenue` (sum of amount filtered to status = 'completed')
            # was removed here in Step 33, with `avg_order_value` which was
            # derived from it. It was the RESTATED number by accident: a
            # refunded order stops being 'completed', so a September refund
            # silently reduced July. Nobody chose that, and it sat in the
            # dropdown under a friendly name where anyone could pick it and be
            # wrong. Revenue is defined once, on fct_revenue_events.
            gross_amount:
              type: sum
              label: Gross Amount (all statuses)
              description: >
                Sum of amount across every status, cancelled and pending
                included. NOT revenue -- an order total, useful for
                by-status comparisons only.
      - name: order_date
        data_tests:
          - not_null
        meta:
          dimension:
            type: date
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, completed, cancelled, refunded]
        meta:
          dimension:
            type: string
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: source('shop', 'customers')
                field: id
        meta:
          dimension:
            type: number
      - name: category
        meta:
          dimension:
            type: string
      - name: product_name
        meta:
          dimension:
            type: string
      - name: quantity
        meta:
          metrics:
            total_quantity:
              type: sum

  - name: dim_customers
    description: Customer dimension, one row per customer, joined to fct_orders on customer_id.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
        meta:
          dimension:
            type: number
      - name: name
        meta:
          dimension:
            type: string
            label: Customer Name
      - name: country
        meta:
          dimension:
            type: string
      - name: signup_date
        meta:
          dimension:
            type: date

  - name: dim_date
    description: Date dimension, one row per calendar day from 2025-01-01 to 2026-12-31.
    columns:
      - name: date_key
        description: YYYYMMDD integer. Surrogate key facts join on.
        data_tests:
          - unique
          - not_null
        meta:
          dimension:
            type: number
            label: Date Key
      - name: full_date
        data_tests:
          - unique
          - not_null
        meta:
          dimension:
            type: date
            label: Date
      - name: year
        meta:
          dimension:
            type: number
      - name: quarter
        meta:
          dimension:
            type: number
            label: Quarter
      - name: month
        meta:
          dimension:
            type: number
      - name: month_name
        meta:
          dimension:
            type: string
            label: Month Name
      - name: day_of_month
        meta:
          dimension:
            type: number
            label: Day of Month
      - name: day_of_week
        meta:
          dimension:
            type: number
            label: Day of Week
      - name: day_name
        meta:
          dimension:
            type: string
            label: Day Name
      - name: is_weekend
        meta:
          dimension:
            type: boolean
            label: Is Weekend
      - name: iso_week
        meta:
          dimension:
            type: number
            label: ISO Week

  - name: fct_revenue_events
    description: >
      One row per revenue event -- a booking and a refund are two events, not
      one order with a flag. Carries both event_date and order_date so the same
      sum can be asked as-booked or restated.

      REVENUE POLICY (decided Step 33): official revenue is NET REVENUE BY
      EVENT DATE -- as booked. A refund reduces the month it was issued in, so
      a closed month stays closed and a number already reported never moves.
      What that costs us: a month takes a hit for refunds on orders it never
      booked, so a bad refund month looks like a bad sales month. Restated --
      the same metric by Order Date -- is the legitimate answer to "what was
      this cohort actually worth", and is the only correct choice for cohort
      and LTV work. It is never the headline figure.
      Any revenue number quoted without saying which date it is attributed to
      is incomplete. Chart: "Net Revenue: As Booked vs Restated".
    meta:
      metrics:
        avg_order_value:
          type: number
          label: Avg Order Value
          description: Gross booked revenue per booked order. Refunds excluded -- this is what an order was worth when placed.
          sql: ${gross_revenue} / NULLIF(${booked_orders}, 0)
    columns:
      - name: event_id
        description: order_id + event_type. The grain, stated.
        data_tests:
          - unique
          - not_null
        meta:
          dimension:
            type: string
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
        meta:
          dimension:
            type: string
          metrics:
            booked_orders:
              type: count_distinct
              label: Booked Orders
              description: Distinct orders that were actually booked. Replaces fct_orders.total_orders as the denominator for revenue-derived metrics.
              filters:
                - event_type: booking
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: [booking, refund]
        meta:
          dimension:
            type: string
      - name: event_date
        description: When the event happened. Group by this for AS-BOOKED revenue.
        data_tests:
          - not_null
        meta:
          dimension:
            type: date
            label: Event Date (as booked)
      - name: order_date
        description: When the order was placed. Group by this for RESTATED revenue.
        data_tests:
          - not_null
        meta:
          dimension:
            type: date
            label: Order Date (restated)
      - name: signed_amount
        description: Positive for a booking, negative for a refund.
        data_tests:
          - not_null
        meta:
          metrics:
            net_revenue:
              type: sum
              label: Net Revenue
              description: >
                OFFICIAL REVENUE, when grouped by Event Date (as booked).
                Bookings minus refunds. Grouped by Order Date it is the
                restated figure instead -- correct for cohort work, never the
                headline. The dimension picks the policy, so always state it.
            gross_revenue:
              type: sum
              label: Gross Revenue
              description: Booked revenue before any refund is subtracted.
              filters:
                - event_type: booking

  - name: revenue_by_month_attribution
    description: >
      Net revenue per month, once per attribution policy. Long format: the
      attribution column is the pivot that puts as-booked and restated on one
      shared axis.
    columns:
      - name: month
        data_tests:
          - not_null
        meta:
          dimension:
            type: date
            label: Month
      - name: attribution
        description: as_booked = the month the event happened. restated = the month the order was placed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [as_booked, restated]
        meta:
          dimension:
            type: string
            label: Attribution
      - name: net_revenue
        data_tests:
          - not_null
        meta:
          metrics:
            net_revenue_by_attribution:
              type: sum
              label: Net Revenue
              description: Bookings minus refunds, attributed by the policy in the Attribution field.
